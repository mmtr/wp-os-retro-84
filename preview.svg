<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" shape-rendering="crispEdges" role="img" aria-label="Retro 84">
	<!-- The theme previewing itself: dithered desk, menu bar, one window. -->
	<defs>
		<pattern id="dither" width="2" height="2" patternUnits="userSpaceOnUse">
			<rect width="2" height="2" fill="#ffffff"/>
			<rect width="1" height="1" fill="#000000"/>
			<rect x="1" y="1" width="1" height="1" fill="#000000"/>
		</pattern>
		<pattern id="stripes" width="2" height="2" patternUnits="userSpaceOnUse">
			<rect width="2" height="1" fill="#000000"/>
			<rect y="1" width="2" height="1" fill="#ffffff"/>
		</pattern>
	</defs>
	<rect width="320" height="200" fill="url(#dither)"/>

	<!-- Menu bar -->
	<rect width="320" height="14" fill="#ffffff"/>
	<rect y="14" width="320" height="1" fill="#000000"/>
	<g fill="#000000">
		<rect x="8" y="4" width="6" height="6"/>
		<rect x="24" y="5" width="18" height="4"/>
		<rect x="50" y="5" width="16" height="4"/>
		<rect x="74" y="5" width="18" height="4"/>
		<rect x="100" y="5" width="28" height="4"/>
	</g>

	<!-- Disk and trash icons -->
	<g>
		<rect x="282" y="24" width="20" height="18" fill="#ffffff" stroke="#000000" stroke-width="1"/>
		<rect x="286" y="24" width="12" height="6" fill="#000000"/>
		<rect x="278" y="46" width="28" height="6" fill="#ffffff"/>
		<rect x="284" y="160" width="16" height="18" fill="#ffffff" stroke="#000000" stroke-width="1"/>
		<rect x="282" y="157" width="20" height="3" fill="#000000"/>
		<rect x="278" y="182" width="28" height="6" fill="#ffffff"/>
	</g>

	<!-- Window -->
	<rect x="40" y="34" width="222" height="136" fill="#ffffff" stroke="#000000" stroke-width="1"/>
	<rect x="41" y="170" width="222" height="1" fill="#000000"/>
	<rect x="262" y="35" width="1" height="136" fill="#000000"/>
	<rect x="43" y="37" width="217" height="11" fill="url(#stripes)"/>
	<rect x="40" y="50" width="222" height="1" fill="#000000"/>
	<rect x="50" y="37" width="11" height="11" fill="#ffffff"/>
	<rect x="51.5" y="38.5" width="8" height="8" fill="none" stroke="#000000" stroke-width="1"/>
	<rect x="122" y="36" width="60" height="13" fill="#ffffff"/>
	<rect x="128" y="40" width="48" height="5" fill="#000000"/>
	<g fill="#000000">
		<rect x="56" y="64" width="18" height="14" fill="none" stroke="#000000" stroke-width="1"/>
		<rect x="98" y="64" width="18" height="14" fill="none" stroke="#000000" stroke-width="1"/>
		<rect x="140" y="64" width="18" height="14" fill="none" stroke="#000000" stroke-width="1"/>
		<rect x="54" y="84" width="22" height="3"/>
		<rect x="96" y="84" width="22" height="3"/>
		<rect x="138" y="84" width="22" height="3"/>
	</g>
</svg>
